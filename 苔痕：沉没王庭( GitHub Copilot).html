<html lang="zh-CN">
<head>

<title>苔痕：沉没王庭</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap');
:root{color-scheme:dark;--bg:#111713;--panel:#1b251f;--line:#3d4a3e;--text:#e8e3d2;--muted:#9aa492;--moss:#b5ca7e;--gold:#e7c47c;--red:#dd806c;--blue:#8bc9bb;--sans:'Noto Sans SC','Microsoft YaHei',sans-serif;--mono:'DM Mono',Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}body{background:radial-gradient(ellipse at 18% 0%,#26342a 0,transparent 42%),radial-gradient(ellipse at 95% 100%,#282a20 0,transparent 37%),#111713}button{font:inherit;color:inherit}#app{width:min(1420px,100%);min-height:100vh;margin:auto;padding:17px 22px 22px;display:grid;grid-template-columns:minmax(0,1fr) 318px;grid-template-rows:auto 1fr;gap:14px 18px}.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 2px 11px}.brand{display:flex;align-items:center;gap:12px}.sigil{width:28px;height:28px;border:1px solid #7b8c59;color:var(--moss);display:grid;place-items:center;transform:rotate(45deg)}.sigil span{transform:rotate(-45deg);font-size:17px}.brand h1{margin:0;font:400 28px 'Ma Shan Zheng',serif;letter-spacing:2px;color:#ded9bd}.brand small{display:block;color:var(--muted);font:9px var(--mono);letter-spacing:1.5px;margin-top:1px}.top-actions{display:flex;align-items:center;gap:9px}.souls{font:10px var(--mono);color:var(--gold);padding-right:8px}.icon-btn{width:34px;height:32px;border:1px solid var(--line);background:#202a22;border-radius:3px;cursor:pointer}.icon-btn:hover{border-color:var(--moss);color:var(--moss)}#stage{position:relative;align-self:start;min-width:0;overflow:hidden;border:1px solid #55624b;border-radius:4px;background:#101612;box-shadow:0 20px 58px #080d0abd,0 0 0 5px #1b251f}.canvas-wrap{position:relative;width:100%;aspect-ratio:768/576}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.stage-label{position:absolute;top:12px;left:13px;display:flex;align-items:center;gap:8px;z-index:1;pointer-events:none;font:10px var(--mono);letter-spacing:1px;text-shadow:0 1px 5px #000}.stage-label i{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 8px var(--moss)}.stage-label span{color:#b4bdab}.side{min-width:0;display:flex;flex-direction:column;gap:9px}.panel{padding:12px 13px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(145deg,#222d25f5,#18211bf7);box-shadow:0 5px 16px #080d0a4d}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.label{font:10px var(--mono);letter-spacing:1.5px;color:#a4af9d}.value{font:10px var(--mono);color:var(--moss)}.meter{margin:7px 0}.meter-head{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--muted);font-size:10px}.meter-head b{font:10px var(--mono);color:#e6e3d5}.bar{height:8px;background:#101612;border:1px solid #3a483b;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;transition:width .17s}.hp i{background:linear-gradient(90deg,#b65b4d,#e58b70)}.food i{background:linear-gradient(90deg,#ba9657,#e9cc81)}.xp i{background:linear-gradient(90deg,#659b84,#b2d185)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.stat{padding:6px 2px 4px;text-align:center;border:1px solid #354238;background:#131b1675}.stat b{display:block;font:16px var(--mono);color:var(--text)}.stat span{font-size:9px;color:var(--muted)}.equip{display:flex;justify-content:space-between;gap:5px;margin-top:9px;color:var(--muted);font-size:9px}.equip b{color:var(--gold);font-weight:500}.status{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.badge{font-size:9px;padding:2px 6px;border:1px solid #596c4c;color:#c4d699}.badge.danger{color:#e9a391;border-color:#845146}.inventory{display:grid;grid-template-columns:1fr 1fr;gap:5px}.item{display:flex;align-items:center;gap:7px;min-width:0;min-height:34px;padding:5px 7px;text-align:left;border:1px solid #3a483b;border-radius:3px;background:#121a15;cursor:pointer}.item:hover{border-color:var(--moss)}.item-icon{width:17px;text-align:center;color:var(--gold);font:15px var(--mono)}.item-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px}.item-use{color:var(--muted);font-size:9px}.empty{grid-column:1/-1;color:#758074;font-size:10px;padding:4px 1px}.traits{display:flex;gap:5px;flex-wrap:wrap}.trait{padding:3px 6px;border:1px solid #45523f;background:#18221a;font-size:9px;color:#bdc9ab}.trait b{color:var(--moss);font-weight:500}.log{height:128px;overflow:auto;display:flex;flex-direction:column-reverse;gap:4px;font-size:10px;line-height:1.5;scrollbar-color:#586650 #18211b;scrollbar-width:thin}.log p{margin:0;color:#b7c0b2}.log p:first-child{color:#e7e2d1}.log .good{color:#bada8f}.log .bad{color:#e4937e}.log .loot{color:#e7c47c}.log .hint{color:#8dc7b7}.controls{font-size:10px;line-height:1.85;color:var(--muted)}kbd{font:10px var(--mono);padding:1px 4px;color:#e4e3d6;border:1px solid #566151;border-bottom-width:2px;border-radius:2px;background:#121915}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:linear-gradient(90deg,#101713ed,#101713ac 58%,#101713e0);backdrop-filter:blur(2px)}.overlay.hidden{display:none}.modal{width:min(470px,100%);max-height:94%;overflow:auto;padding:24px 26px;border-left:2px solid var(--moss);background:#151f19f2;box-shadow:0 20px 60px #060a08c7}.kicker{font:10px var(--mono);letter-spacing:1.7px;color:var(--moss)}.modal h2{margin:9px 0 3px;font:400 40px 'Ma Shan Zheng',serif;color:#e1d9b9}.modal .english{font:10px var(--mono);letter-spacing:1.5px;color:#8c9b83}.modal p{margin:14px 0;font-size:12px;line-height:1.85;color:#bbc4b4}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 17px}.tag{padding:4px 7px;border:1px solid #46533f;background:#1c271e;color:#c5cbb7;font-size:9px}.primary{padding:10px 16px;border:1px solid #d3de92;border-radius:2px;background:#b7c875;color:#192018;font-weight:700;cursor:pointer}.primary:hover{background:#d2df8e}.secondary{padding:9px 12px;border:1px solid #4a5947;border-radius:2px;background:#202b23;color:#e2e1d2;cursor:pointer}.secondary:hover{border-color:var(--moss)}.footnote{margin-top:11px;color:#879382;font-size:9px;line-height:1.7}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.choice{min-height:128px;padding:11px;text-align:left;border:1px solid #4d5b43;background:linear-gradient(145deg,#263228,#19231c);cursor:pointer}.choice:hover{border-color:var(--moss);transform:translateY(-2px)}.choice .icon{font-size:21px;color:var(--moss)}.choice h3{margin:7px 0 4px;font-size:12px;color:#e7e4d4}.choice p{margin:0;font-size:9px;line-height:1.6;color:#abb6a8}.choice small{display:block;margin-top:7px;color:#aabb7d;font:9px var(--mono)}.perks{display:flex;flex-direction:column;gap:5px;margin-top:10px}.perk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px;border:1px solid #3f4b3c;background:#19231c}.perk b{font-size:10px;color:#e2e2d2}.perk button{border:1px solid #617047;background:#303d29;color:var(--gold);font:9px var(--mono);padding:5px 7px;cursor:pointer}.perk button:disabled{opacity:.4;cursor:default}.mobile-pad{display:none;position:absolute;left:12px;bottom:14px;z-index:3;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px;touch-action:none}.mobile-pad button{border:1px solid #b7c58270;border-radius:3px;background:#19271edd;color:#e8ebd9;font:17px var(--mono);touch-action:none}.mobile-pad button:active{background:#84994f99}.mobile-pad .wait{font:9px var(--sans);color:var(--gold)}.mobile-actions{display:none;position:absolute;right:12px;bottom:18px;z-index:3;flex-direction:column;gap:5px}.mobile-actions button{padding:9px 11px;border:1px solid #bdcc8a88;background:#18241ddb;color:#e6e8d7;font-size:10px;touch-action:manipulation}.shake{animation:shake .18s}@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
@media(max-width:850px){#app{grid-template-columns:minmax(0,1fr) 280px;padding:12px;gap:11px}.brand h1{font-size:25px}}@media(max-width:660px){#app{display:flex;flex-direction:column;padding:9px;gap:9px}.topbar{padding-bottom:8px}.brand{gap:8px}.sigil{width:23px;height:23px}.brand h1{font-size:23px}.brand small{font-size:7px;letter-spacing:.7px}.top-actions{gap:5px}.souls{font-size:9px}.icon-btn{width:29px;height:28px}#stage{width:100%;align-self:stretch}.stage-label{left:8px;top:8px;font-size:8px}.side{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:7px}.panel{padding:9px}.status-panel,.inventory-panel,.log-panel,.controls-panel{grid-column:1/-1}.log{height:88px}.mobile-pad{display:grid}.mobile-actions{display:flex}.stats{margin-top:7px}.panel-head{margin-bottom:6px}.modal{padding:18px}.modal h2{font-size:34px}.choice-grid{gap:5px}.choice{padding:8px;min-height:122px}.choice h3{font-size:11px}.choice p{font-size:9px}}@media(max-width:390px){.brand small{display:none}.inventory-panel,.log-panel,.controls-panel{grid-column:1/-1}.choice-grid{grid-template-columns:1fr}.choice{min-height:0;display:grid;grid-template-columns:26px 1fr;column-gap:7px;align-items:center}.choice .icon{grid-row:span 2}.choice h3{margin:2px 0}.choice p,.choice small{grid-column:2}.choice small{margin-top:4px}.modal{max-height:94vh}}

<body>
<main id="app">
<header class="topbar"><div class="brand"><div class="sigil"><span>✦</span></div><div><h1>苔痕：沉没王庭</h1><small>THE SUNKEN COURT · TURN-BASED DUNGEON</small></div></div><div class="top-actions"><span class="souls" id="soulsTop">魂火 0</span><button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">♫</button><button class="icon-btn" id="helpBtn" title="查看操作" aria-label="查看操作">?</button></div></header>
<section id="stage"><div class="canvas-wrap"><canvas id="map" width="768" height="576" aria-label="沉没王庭地牢"></canvas><div class="stage-label"><i></i><b id="floorLabel">地表遗迹</b><span id="turnLabel">第 0 回合</span></div><div class="mobile-pad" aria-label="触屏方向键"><span></span><button data-step="0,-1">↑</button><span></span><button data-step="-1,0">←</button><button class="wait" id="waitButton">等待</button><button data-step="1,0">→</button><span></span><button data-step="0,1">↓</button><span></span></div><div class="mobile-actions"><button id="stairsButton">下楼 ↓</button><button id="pickupButton">拾取 E</button></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div></div></section>
<aside class="side">
<section class="panel status-panel"><div class="panel-head"><span class="label">EXPLORER / 探险者</span><span class="value" id="floorValue">深度 01 / 08</span></div><div class="meter"><div class="meter-head"><span>生命</span><b id="hpText">—</b></div><div class="bar hp"><i id="hpBar"></i></div></div><div class="meter"><div class="meter-head"><span>饱食</span><b id="foodText">—</b></div><div class="bar food"><i id="foodBar"></i></div></div><div class="meter"><div class="meter-head"><span>经验</span><b id="xpText">—</b></div><div class="bar xp"><i id="xpBar"></i></div></div><div class="stats"><div class="stat"><b id="levelText">1</b><span>等级</span></div><div class="stat"><b id="attackText">2–5</b><span>攻击</span></div><div class="stat"><b id="defenseText">1</b><span>防御</span></div><div class="stat"><b id="goldText">0</b><span>金币</span></div></div><div class="equip"><span>兵器 <b id="weaponText">锈蚀短剑</b></span><span>护甲 <b id="armorText">旧皮衣</b></span></div><div class="status" id="statusBadges"></div></section>
<section class="panel inventory-panel"><div class="panel-head"><span class="label">SATCHEL / 行囊</span><span class="value" id="bagCount">0 / 10</span></div><div class="inventory" id="inventory"></div></section>
<section class="panel"><div class="panel-head"><span class="label">OATHS / 本局祝福</span><span class="value" id="oathCount">0</span></div><div class="traits" id="oaths"><span class="trait">尚未获得祝福</span></div></section>
<section class="panel log-panel"><div class="panel-head"><span class="label">FIELD NOTES / 旅途记录</span><span class="value" id="killCount">击败 0</span></div><div class="log" id="log" aria-live="polite"></div></section>
<section class="panel controls-panel"><div class="panel-head"><span class="label">ACTIONS / 操作</span><span class="value">回合制</span></div><div class="controls"><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动与攻击　<kbd>.</kbd> 等待<br><kbd>E</kbd> 拾取　<kbd>&gt;</kbd> 下楼　点击行囊使用道具<br>每步都会推进敌人行动与饥饿。按住方向可连续探索。</div></section>
</aside></main>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,T=24,COLS=W/T,ROWS=H/T,MW=68,MH=52,MAX_FLOOR=8,TAU=Math.PI*2,$=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n),between=(a,b)=>a+rand(b-a+1),pick=a=>a[rand(a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const floorNames=['盐雾回廊','苔井旧城','沉钟墓室','无月蓄水池','断誓圣所','王庭根须','白骨蓄水库','沉王王座'];
const catalog=[{name:'穴鼠',glyph:'r',hp:6,atk:[1,3],def:0,xp:3,color:'#d2b790',gold:[1,3]},{name:'苔甲虫',glyph:'b',hp:10,atk:[2,4],def:1,xp:5,color:'#a9bd75',gold:[2,5]},{name:'失誓侍卫',glyph:'s',hp:15,atk:[3,6],def:1,xp:8,color:'#d58c70',gold:[3,7]},{name:'井中幽灵',glyph:'w',hp:11,atk:[3,7],def:0,xp:9,color:'#8bc9bb',gold:[2,8]},{name:'盐骨巨像',glyph:'G',hp:24,atk:[5,9],def:3,xp:15,color:'#dbca91',gold:[6,12]}];
const potions=[{id:'heal',name:'绛红药剂',desc:'恢复 12 点生命',fn:q=>{const n=Math.min(12,q.p.hpMax-q.p.hp);q.p.hp+=n;log(`药液修复了 ${n} 点生命。`,'good');}},{id:'might',name:'金辉药剂',desc:'本局攻击永久 +1',fn:q=>{q.p.atkBonus++;log('力量涌入双臂，本局攻击永久提升。','good');}},{id:'full',name:'青瓷药剂',desc:'恢复 30 点饱食',fn:q=>{q.p.food=Math.min(100,q.p.food+30);log('清凉感驱散了饥饿。','good');}},{id:'ward',name:'灰银药剂',desc:'获得 8 点护盾',fn:q=>{q.p.shield+=8;log('灰银护盾围绕你凝结。','good');}},{id:'poison',name:'浑浊药剂',desc:'中毒 5 回合',fn:q=>{q.p.poison=5;log('毒素沿血脉扩散。','bad');}}];
const scrolls=[{id:'fire',name:'焦痕卷轴',desc:'对视野内最近敌人造成 16 伤害',fn:q=>{const e=nearest(q,8);if(e){e.hp-=16;log(`火焰吞没了${e.name}。`,'good');if(e.hp<=0)killEnemy(e);}else log('卷轴亮起，但附近没有敌人。','hint');}},{id:'blink',name:'褪色卷轴',desc:'传送到本层已探索的空地',fn:q=>{const spots=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(q.map[y][x]===1&&q.seen[y][x]&&!monsterAt(q,x,y)&&!(x===q.p.x&&y===q.p.y))spots.push({x,y});if(spots.length){const v=pick(spots);q.p.x=v.x;q.p.y=v.y;log('空间折叠，你落在另一块石地上。','hint');}}},{id:'reveal',name:'墨迹卷轴',desc:'揭开本层地图并标记陷阱',fn:q=>{for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(q.map[y][x])q.seen[y][x]=1;q.traps.forEach(t=>t.seen=true);log('地图与隐藏机关在脑海中展开。','hint');}},{id:'blast',name:'断雷卷轴',desc:'对全层敌人造成 8 伤害',fn:q=>{for(const e of [...q.monsters]){e.hp-=8;if(e.hp<=0)killEnemy(e);}log('雷声穿过石壁，震伤了所有敌人。','good');}}];
const blessings=[{id:'edge',name:'裂隙磨刃',icon:'⚔',desc:'攻击永久 +1，伤害更稳定。',apply:p=>p.atkBonus++},{id:'heart',name:'沉王余烬',icon:'♥',desc:'最大生命 +5，并恢复 8 点生命。',apply:p=>{p.hpMax+=5;p.hp=Math.min(p.hpMax,p.hp+8);}},{id:'shell',name:'苔甲祝祷',icon:'⬟',desc:'防御 +1，抵挡每次攻击。',apply:p=>p.def++},{id:'hunger',name:'旅者的盐',icon:'◈',desc:'恢复饱食，饥饿消耗减半。',apply:p=>{p.food=Math.min(100,p.food+35);p.hungerRate*=.5;}},{id:'fortune',name:'拾骨人的运气',icon:'✧',desc:'金币与魂火收获提高 30%。',apply:p=>p.fortune+=.3},{id:'siphon',name:'苔光汲取',icon:'✿',desc:'击败敌人时恢复 1 点生命。',apply:p=>p.siphon++},{id:'stride',name:'旧路回声',icon:'➤',desc:'每层首次受伤减免 5 点。',apply:p=>p.ward++},{id:'ember',name:'魂火共鸣',icon:'☼',desc:'击败敌人获得额外经验。',apply:p=>p.xpBonus++}];
let save=loadSave(),g=null,soundOn=false,audio=null,tick=0;
function loadSave(){try{const s=JSON.parse(localStorage.getItem('mossCourtRogueSave')||'{}');return{souls:s.souls||0,bestFloor:s.bestFloor||0,bestKills:s.bestKills||0,upgrades:Object.assign({heart:0,edge:0,ward:0},s.upgrades||{})};}catch{return{souls:0,bestFloor:0,bestKills:0,upgrades:{heart:0,edge:0,ward:0}};}}
function persist(){try{localStorage.setItem('mossCourtRogueSave',JSON.stringify(save));}catch{}}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function log(text,type=''){if(!g)return;g.logs.unshift({text,type});g.logs=g.logs.slice(0,32);$('log').innerHTML=g.logs.slice(0,12).map(x=>`<p class="${x.type}">${esc(x.text)}</p>`).join('');}
function newRun(){g={state:'play',floor:1,turn:0,kills:0,earned:0,map:[],seen:[],rooms:[],monsters:[],items:[],traps:[],stairs:null,logs:[],oaths:[],pendingOaths:0,floorOath:false,identified:new Set(),seed:Math.random().toString(36).slice(2,8),p:{x:0,y:0,hp:24+save.upgrades.heart*3,hpMax:24+save.upgrades.heart*3,food:100,xp:0,level:1,atk:[2,5],atkBonus:save.upgrades.edge,def:1+save.upgrades.ward,gold:0,weapon:'锈蚀短剑',armor:'旧皮衣',inventory:[],shield:0,poison:0,hungerRate:1,fortune:0,siphon:0,xpBonus:0,layerWard:0}};$('log').innerHTML='';$('overlay').classList.add('hidden');generateFloor();log('你踏入了沉没王庭。石缝里有风。','hint');log('找到石阶，活着带着王印回来。');updateUI();draw();}
function carve(x,y){if(x>0&&y>0&&x<MW-1&&y<MH-1)g.map[y][x]=1;}
function overlap(a,b){return a.x<=b.x+b.w+1&&a.x+a.w+1>=b.x&&a.y<=b.y+b.h+1&&a.y+a.h+1>=b.y;}
function room(r){for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)carve(x,y);}
function corridor(a,b){let x=between(a.x+1,a.x+a.w-2),y=between(a.y+1,a.y+a.h-2),tx=between(b.x+1,b.x+b.w-2),ty=between(b.y+1,b.y+b.h-2);if(Math.random()<.5){while(x!==tx){carve(x,y);x+=Math.sign(tx-x);}while(y!==ty){carve(x,y);y+=Math.sign(ty-y);}}else{while(y!==ty){carve(x,y);y+=Math.sign(ty-y);}while(x!==tx){carve(x,y);x+=Math.sign(tx-x);}}carve(tx,ty);}
function generateFloor(){g.map=Array.from({length:MH},()=>Array(MW).fill(0));g.seen=Array.from({length:MH},()=>Array(MW).fill(0));g.rooms=[];g.monsters=[];g.items=[];g.traps=[];for(let i=0;i<150&&g.rooms.length<16;i++){const r={x:between(2,MW-15),y:between(2,MH-12),w:between(6,12),h:between(5,9)};if(g.rooms.every(a=>!overlap(r,a))){room(r);if(g.rooms.length)corridor(g.rooms[g.rooms.length-1],r);g.rooms.push(r);}}if(g.rooms.length<3){g.rooms=[];for(const r of[{x:3,y:3,w:10,h:8},{x:27,y:19,w:11,h:8},{x:52,y:39,w:10,h:8}]){room(r);if(g.rooms.length)corridor(g.rooms[g.rooms.length-1],r);g.rooms.push(r);}}
const start=g.rooms[0],last=g.rooms[g.rooms.length-1];g.p.x=start.x+Math.floor(start.w/2);g.p.y=start.y+Math.floor(start.h/2);g.stairs={x:last.x+Math.floor(last.w/2),y:last.y+Math.floor(last.h/2)};
for(let i=0;i<6+g.floor*2;i++){const r=pick(g.rooms.slice(1)),q=spot(r);if(!q)continue;const base=pick(catalog.slice(0,Math.min(catalog.length,2+Math.floor(g.floor/2)))),scale=1+(g.floor-1)*.14;g.monsters.push({...base,x:q.x,y:q.y,hp:Math.ceil(base.hp*scale),maxHp:Math.ceil(base.hp*scale),atk:[base.atk[0]+Math.floor((g.floor-1)/3),base.atk[1]+Math.floor((g.floor-1)/2)],alive:true,boss:false});}
if(g.floor===MAX_FLOOR)g.monsters.push({name:'沉王·奥铎',glyph:'D',x:g.stairs.x,y:g.stairs.y,hp:95,maxHp:95,atk:[8,14],def:4,xp:55,gold:[40,65],color:'#e58c6d',alive:true,boss:true});
for(let i=0;i<7+g.floor;i++){const q=spot(pick(g.rooms));if(q)g.items.push({...q,type:'food',name:pick(['腌蘑菇','干果','盐渍鱼']),glyph:'%',value:between(18,28)});}for(let i=0;i<4+Math.floor(g.floor/2);i++){const q=spot(pick(g.rooms));if(!q)continue;const isPotion=Math.random()<.62;g.items.push({...q,type:isPotion?'potion':'scroll',name:isPotion?'未鉴定药剂':'封蜡卷轴',glyph:isPotion?'!':'?',effect:pick(isPotion?potions:scrolls),identified:false});}for(let i=0;i<4;i++){const q=spot(pick(g.rooms));if(q)g.items.push({...q,type:'gold',name:'散落金币',glyph:'$',value:between(3,10+g.floor*2)});}if(g.floor%2===0){const q=spot(pick(g.rooms));if(q)g.items.push({...q,type:'weapon',name:'卫士长枪',glyph:'†',value:2});}for(let i=0;i<2+Math.floor(g.floor/3);i++){const q=spot(pick(g.rooms));if(q)g.traps.push({...q,armed:true,seen:false});}reveal();if(g.floorOath){g.floorOath=false;showOath('楼层祝福');}}
function spot(r){for(let i=0;i<100;i++){const x=between(r.x+1,r.x+r.w-2),y=between(r.y+1,r.y+r.h-2);if(g.map[y]?.[x]===1&&!(x===g.p.x&&y===g.p.y)&&!(x===g.stairs.x&&y===g.stairs.y)&&!g.monsters.some(m=>m.x===x&&m.y===y)&&!g.items.some(a=>a.x===x&&a.y===y))return{x,y};}return null;}
function monsterAt(q,x,y){return q.monsters.find(m=>m.alive&&m.x===x&&m.y===y);}function itemAt(x,y){return g.items.find(i=>i.x===x&&i.y===y);}function walkable(x,y){return g.map[y]?.[x]===1;}
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;while(true){if(x0===x1&&y0===y1)return true;if(!(x0===g.p.x&&y0===g.p.y)&&!walkable(x0,y0))return false;const e=2*err;if(e>=dy){err+=dy;x0+=sx;}if(e<=dx){err+=dx;y0+=sy;}}}
function visible(x,y){return Math.abs(x-g.p.x)<=8&&Math.abs(y-g.p.y)<=7&&los(g.p.x,g.p.y,x,y);}function reveal(){for(let y=Math.max(0,g.p.y-8);y<=Math.min(MH-1,g.p.y+8);y++)for(let x=Math.max(0,g.p.x-8);x<=Math.min(MW-1,g.p.x+8);x++)if(visible(x,y))g.seen[y][x]=1;for(const t of g.traps)if(visible(t.x,t.y))t.seen=true;}
function nearest(q,r){return q.monsters.filter(m=>m.alive&&visible(m.x,m.y)&&Math.abs(m.x-q.p.x)+Math.abs(m.y-q.p.y)<=r).sort((a,b)=>(Math.abs(a.x-q.p.x)+Math.abs(a.y-q.p.y))-(Math.abs(b.x-q.p.x)+Math.abs(b.y-q.p.y)))[0];}
function move(dx,dy){if(!g||g.state!=='play')return;const p=g.p,nx=p.x+dx,ny=p.y+dy;if(!walkable(nx,ny)){log('湿冷的石墙挡住了去路。');return;}const e=monsterAt(g,nx,ny);if(e){attack(e);advance();return;}p.x=nx;p.y=ny;const trap=g.traps.find(t=>t.x===nx&&t.y===ny&&t.armed);if(trap){trap.armed=false;trap.seen=true;const dmg=Math.max(1,between(3,5+Math.floor(g.floor/2))-p.def);hurt(dmg,`你踩中尖刺机关（-${dmg}）。`);if(g.state!=='play')return;}const it=itemAt(nx,ny);if(it)pickup(it);if(nx===g.stairs.x&&ny===g.stairs.y){if(g.floor<MAX_FLOOR)log('石阶通向更深处。按 > 下楼。','hint');else if(!monsterAt(g,nx,ny))endRun(true);}advance();}
function attack(e){const p=g.p,dmg=Math.max(1,between(p.atk[0],p.atk[1])+p.atkBonus-e.def);e.hp-=dmg;log(`你击中${e.name}，造成 ${dmg} 点伤害。`,'good');sound(170);if(e.hp<=0)killEnemy(e);}

function killEnemy(e){if(!e.alive)return;e.alive=false;const p=g.p,xp=e.xp+(p.xpBonus?Math.ceil(e.xp*.2):0);g.kills++;p.xp+=xp;p.gold+=Math.round(between(e.gold[0],e.gold[1])*(1+p.fortune));g.earned+=(e.boss?18:1+Math.floor(g.floor/3));log(`${e.name}倒下。获得 ${xp} 经验与战利品。`,'loot');if(p.siphon)p.hp=Math.min(p.hpMax,p.hp+p.siphon);if(e.boss)log('沉王护印碎裂，出口显露。','good');while(p.xp>=p.level*12){p.xp-=p.level*12;p.level++;p.hpMax+=3;p.hp=Math.min(p.hpMax,p.hp+5);g.pendingOaths++;}if(g.pendingOaths&&g.state==='play')showOath('灵魂共振');}

function enemyTurn(){const p=g.p;for(const e of g.monsters){if(!e.alive)continue;const d=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);if(d===1){const raw=between(e.atk[0],e.atk[1]),dmg=Math.max(0,raw-p.def);hurt(dmg,`${e.name}攻击你（-${dmg}）。`);if(g.state!=='play')return;continue;}if(d>8||!visible(e.x,e.y))continue;const opts=[[0,-1],[-1,0],[1,0],[0,1]].sort(()=>Math.random()-.5);for(const[dx,dy]of opts){const nx=e.x+dx,ny=e.y+dy;if(walkable(nx,ny)&&!monsterAt(g,nx,ny)&&!(nx===p.x&&ny===p.y)&&Math.abs(nx-p.x)+Math.abs(ny-p.y)<d){e.x=nx;e.y=ny;break;}}}}
function pickup(it){const p=g.p;if(it.type==='food'){p.food=Math.min(100,p.food+it.value);log(`吃下${it.name}，饱食恢复 ${it.value}。`,'good');removeItem(it);return;}if(it.type==='gold'){p.gold+=Math.round(it.value*(1+p.fortune));log(`拾起 ${it.value} 枚金币。`,'loot');removeItem(it);return;}if(it.type==='weapon'){p.atkBonus+=it.value;p.weapon=it.name;log(`装备${it.name}，攻击提升 ${it.value}。`,'loot');removeItem(it);return;}if(p.inventory.length>=10){log(`${it.name}落在脚边：行囊已满。`);return;}p.inventory.push(it);log(`拾起${it.name}。`,'loot');removeItem(it);}

function drawEnemy(e,x,y){ctx.fillStyle=e.boss?'#57362d':'#26332b';ctx.beginPath();ctx.ellipse(x+12,y+15,9,7,0,0,TAU);ctx.fill();glyph(e.glyph,x+12,y+11,e.color,e.boss?20:16);if(e.hp<e.maxHp){ctx.fillStyle='#111713';ctx.fillRect(x+3,y+1,18,3);ctx.fillStyle='#d77965';ctx.fillRect(x+3,y+1,18*e.hp/e.maxHp,3);}}
function drawPlayer(x,y){const bob=Math.sin(tick/4)*.5;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x+12,y+19,8,3,0,0,TAU);ctx.fill();ctx.fillStyle='#d1ca98';ctx.beginPath();ctx.arc(x+12,y+8+bob,5,0,TAU);ctx.fill();ctx.fillStyle='#617451';ctx.fillRect(x+6,y+11+bob,12,8);ctx.fillStyle='#e6d69d';ctx.fillRect(x+10,y+5+bob,2,2);ctx.fillStyle='#ddd5aa';ctx.fillRect(x+18,y+10+bob,2,10);}
function draw(){if(!g)return;if(g.state==='title'){drawTitle();return;}tick++;ctx.clearRect(0,0,W,H);const cx=clamp(g.p.x-Math.floor(COLS/2),0,MW-COLS),cy=clamp(g.p.y-Math.floor(ROWS/2),0,MH-ROWS),px=(g.p.x-cx+.5)*T,py=(g.p.y-cy+.5)*T;for(let sy=0;sy<ROWS;sy++)for(let sx=0;sx<COLS;sx++){const x=cx+sx,y=cy+sy,t=g.map[y]?.[x]||0,seen=g.seen[y]?.[x],tx=sx*T,ty=sy*T;if(!seen){ctx.fillStyle='#0b110e';ctx.fillRect(tx,ty,T,T);continue;}if(t){ctx.fillStyle=(x*13+y*7)%5===0?'#52604b':'#414d42';ctx.fillRect(tx,ty,T,T);ctx.fillStyle='#313d34';ctx.fillRect(tx+2,ty+T-4,T-4,1);if((x*17+y*31)%19===0){ctx.fillStyle='#79845b';ctx.fillRect(tx+5+x%9,ty+5+y%10,2,3);}}else{ctx.fillStyle='#1e2923';ctx.fillRect(tx,ty,T,T);ctx.fillStyle='#2c382f';ctx.fillRect(tx+2,ty+2,T-4,T-4);ctx.fillStyle='#4a5241';ctx.fillRect(tx+2,ty+2,T-4,2);ctx.fillStyle='#18211b';ctx.fillRect(tx+2,ty+T-3,T-4,1);}ctx.strokeStyle='rgba(8,13,10,.32)';ctx.strokeRect(tx+.5,ty+.5,T,T);if(x===g.stairs.x&&y===g.stairs.y){ctx.fillStyle='#929b6d';ctx.fillRect(tx+5,ty+7,14,11);ctx.fillStyle='#313b2d';ctx.fillRect(tx+8,ty+9,8,2);ctx.fillRect(tx+9,ty+13,6,2);glyph('↓',tx+12,ty+7,'#e8d69b',12);}const tr=g.traps.find(a=>a.x===x&&a.y===y&&a.seen&&a.armed);if(tr)glyph('⌃',tx+12,ty+12,'#cb7e66',15);const it=itemAt(x,y);if(it)glyph(it.glyph,tx+12,ty+13,it.type==='food'?'#b6d38b':it.type==='gold'?'#e7c47c':it.type==='weapon'?'#ddd6a9':it.type==='potion'?'#df907d':'#8bc9bb',16);const e=monsterAt(g,x,y);if(e)drawEnemy(e,tx,ty);}
const light=ctx.createRadialGradient(px,py,22,px,py,245);light.addColorStop(0,'rgba(223,207,151,.15)');light.addColorStop(1,'rgba(6,11,8,0)');ctx.fillStyle=light;ctx.fillRect(0,0,W,H);drawPlayer(px-T/2,py-T/2);const v=ctx.createRadialGradient(W/2,H/2,140,W/2,H/2,600);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(7,12,9,.82)';ctx.fillRect(0,H-20,W,20);ctx.fillStyle='#adb69a';ctx.font='9px "DM Mono",monospace';ctx.fillText(`FLOOR ${String(g.floor).padStart(2,'0')}   ·   ${g.seed.toUpperCase()}   ·   ${g.monsters.filter(e=>e.alive).length} HOSTILES`,10,H-6);}
function drawTitle(){ctx.fillStyle='#121a15';ctx.fillRect(0,0,W,H);for(let i=0;i<120;i++){const x=i*89%W,y=i*131%H;ctx.fillStyle=i%3?'#1c2920':'#303b2d';ctx.fillRect(x,y,i%6+3,1);}for(let r=34;r<300;r+=24){ctx.strokeStyle=`rgba(176,193,126,${.025+(r%5)*.006})`;ctx.beginPath();ctx.arc(W/2,H/2,r,0,TAU);ctx.stroke();}ctx.fillStyle='#ddd3aa';ctx.font='42px "Ma Shan Zheng",serif';ctx.textAlign='center';ctx.fillText('苔痕',W/2,H/2-15);ctx.fillStyle='#94a185';ctx.font='10px "DM Mono",monospace';ctx.fillText('THE SUNKEN COURT',W/2,H/2+13);}
function sound(f){if(!soundOn)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.value=f;v.gain.value=.025;o.connect(v);v.connect(audio.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.stop(audio.currentTime+.1);}catch{}}
function help(){if(g?.state==='play'){log('方向键/WASD移动或撞击攻击；.等待；E拾取；>从石阶下楼。','hint');log('食物降低饥饿；药剂与卷轴需使用后鉴定。每次移动都会消耗一个回合。','hint');}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(g?.state==='oath'&&['1','2','3'].includes(k)){$('modal').querySelectorAll('[data-oath]')[Number(k)-1]?.click();return;}if(k==='w'||k==='arrowup')move(0,-1);else if(k==='s'||k==='arrowdown')move(0,1);else if(k==='a'||k==='arrowleft')move(-1,0);else if(k==='d'||k==='arrowright')move(1,0);else if(k==='.'||k===' ')waitTurn();else if(k==='e')pickupUnderfoot();else if(k==='>')descend();else if(k==='?')help();});
document.querySelectorAll('[data-step]').forEach(b=>{let timer;const step=()=>{const[x,y]=b.dataset.step.split(',').map(Number);move(x,y);};b.addEventListener('pointerdown',e=>{e.preventDefault();step();b.setPointerCapture(e.pointerId);timer=setTimeout(function repeat(){step();timer=setTimeout(repeat,130);},320);});const stop=()=>clearTimeout(timer);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);});
$('waitButton').addEventListener('click',waitTurn);$('stairsButton').addEventListener('click',descend);$('pickupButton').addEventListener('click',pickupUnderfoot);$('helpBtn').addEventListener('click',help);$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'♫':'♪';});$('stage').addEventListener('click',e=>{if(!g||g.state!=='play')return;const r=canvas.getBoundingClientRect(),tx=Math.floor((e.clientX-r.left)/r.width*COLS),ty=Math.floor((e.clientY-r.top)/r.height*ROWS),cx=clamp(g.p.x-Math.floor(COLS/2),0,MW-COLS),cy=clamp(g.p.y-Math.floor(ROWS/2),0,MH-ROWS),dx=cx+tx-g.p.x,dy=cy+ty-g.p.y;if(Math.abs(dx)+Math.abs(dy)===1)move(dx,dy);});
showTitle();updateUI();draw();
})();
</script>
</body>
